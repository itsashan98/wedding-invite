<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Guest List</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    main { max-width: 820px; padding-top: 48px; }
    .card { opacity: 1; transform: none; }
    .login { max-width: 440px; margin: 10vh auto 0; }
    .err { color: #b3413f; min-height: 1.4em; margin: 0; font-size: 1rem; }

    .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; flex-wrap: wrap; text-align: left; }
    .head h2 { margin: 0; }
    .updated { color: var(--muted); font-size: .95rem; margin: 0; }
    .head-btns { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn.small { padding: 6px 16px; font-size: .95rem; }

    .tally { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin: 24px 0; }
    .tally div { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 12px 6px; }
    .tally b { display: block; font-size: 2rem; color: var(--rose-dark); line-height: 1.1; }
    .tally .yes b { color: #5f8a5b; }
    .tally .no b { color: var(--muted); }
    .tally span { font-size: .85rem; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 0 0 14px; }
    .row input { flex: 1 1 220px; min-width: 0; }
    .link-box { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: #fbeef0; border-radius: 12px; padding: 10px 14px; margin: 0 0 18px; text-align: left; }
    code { font-size: .85rem; word-break: break-all; flex: 1 1 200px; color: var(--ink); }

    .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; background: #fff; }
    .seg button { border: 0; background: none; padding: 7px 14px; font: 600 .95rem var(--serif); color: var(--muted); cursor: pointer; }
    .seg button[aria-pressed="true"] { background: var(--rose); color: #fff; }

    .guests { list-style: none; padding: 0; margin: 0; text-align: left; }
    .guests li { border-top: 1px solid var(--line); padding: 14px 0; display: grid; gap: 4px; }
    .gname { font-weight: 600; font-size: 1.2rem; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .chip { font-size: .8rem; font-weight: 600; padding: 2px 10px; border-radius: 999px; background: #f3ecec; color: var(--muted); }
    .chip.yes { background: #e6f0e3; color: #4d7a49; }
    .chip.no { background: #f6e3e3; color: #a2524f; }
    .when, .gmsg { color: var(--muted); font-size: 1rem; }
    .gmsg { font-style: italic; }
    .glink { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 4px; }
    .mini { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 3px 12px; font: 600 .85rem var(--serif); color: var(--rose-dark); cursor: pointer; }
    .mini.danger { color: #a2524f; }
    .empty { color: var(--muted); font-style: italic; }

    .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 20px; border-radius: 999px; font-size: 1rem; z-index: 20; }

    @media (max-width: 560px) { .tally { grid-template-columns: repeat(2, 1fr); } }
  </style>
  <script src="config.js"></script>
</head>
<body>
<main>
  <!-- Sign in -->
  <section class="card login" id="login">
    <h2 id="loginCouple"></h2>
    <p class="note">Guest list, for the couple only. Enter the password set in the Google Apps Script.</p>
    <form id="loginForm">
      <label>Password
        <input type="password" id="pw" autocomplete="current-password" required>
      </label>
      <p class="err" id="loginErr" role="alert"></p>
      <button class="btn primary" type="submit" id="loginBtn">Open guest list</button>
    </form>
  </section>

  <!-- The list -->
  <section class="card" id="panel" hidden>
    <div class="head">
      <div>
        <h2>Guest list</h2>
        <p class="updated" id="updated"></p>
      </div>
      <div class="head-btns">
        <button class="btn small" type="button" id="refresh">Refresh</button>
        <button class="btn small" type="button" id="copyList">Copy list</button>
        <button class="btn small" type="button" id="signOut">Sign out</button>
      </div>
    </div>

    <div class="tally">
      <div class="yes"><b id="t-yes">0</b><span>Attending</span></div>
      <div class="no"><b id="t-no">0</b><span>Can't come</span></div>
      <div><b id="t-wait">0</b><span>No reply yet</span></div>
      <div><b id="t-people">0</b><span>Total guests</span></div>
    </div>

    <form class="row" id="inviteForm">
      <input type="text" id="i-name" placeholder="Guest's name, e.g. Amaya Perera" aria-label="Guest's name" autocomplete="off">
      <button class="btn primary" type="submit" id="inviteBtn">Make their link</button>
    </form>
    <div class="link-box" id="newLink" hidden>
      <code id="newLinkText"></code>
      <button class="mini" type="button" id="copyNewLink">Copy link</button>
      <a class="mini" id="waNewLink" target="_blank" rel="noopener">Send on WhatsApp</a>
    </div>

    <div class="row">
      <input type="search" id="g-search" placeholder="Search names or notes" aria-label="Search guests">
      <div class="seg" role="group" aria-label="Show">
        <button type="button" data-f="all" aria-pressed="true">All</button>
        <button type="button" data-f="yes" aria-pressed="false">Attending</button>
        <button type="button" data-f="no" aria-pressed="false">Can't come</button>
        <button type="button" data-f="wait" aria-pressed="false">No reply</button>
      </div>
    </div>
    <ul class="guests" id="guestList"></ul>
    <p class="empty" id="guestEmpty"></p>
  </section>
</main>

<div class="toast" id="toast" role="status" hidden></div>

<script>
const $ = (id) => document.getElementById(id);
const W = window.WEDDING, API = window.SITE.scriptUrl;
const couple = `${W.partner1} & ${W.partner2}`;
const BASE = window.SITE.siteUrl || new URL("./", location.href).href;
const linkFor = (token) => `${BASE}?g=${encodeURIComponent(token)}`;
const waText = (name, link) => `Dear ${name}, we would love for you to celebrate our wedding with us. Your personal invitation: ${link}`;
$("loginCouple").textContent = couple;

let key = "", guests = [], filter = "all", busy = false;

// ---- Demo mode (admin.html?demo): sample guests kept in memory, any password ----
const DEMO = new URLSearchParams(location.search).has("demo");
const ago = (h) => new Date(Date.now() - h * 3600000).toISOString();
const demoGuests = [
  { token: "demo1", name: "Amaya Perera",     answer: "yes", count: 2, message: "So happy for you both!", repliedAt: ago(5),  createdAt: ago(72) },
  { token: "demo2", name: "Dilan Fernando",   answer: "yes", count: 1, message: "",                       repliedAt: ago(20), createdAt: ago(72) },
  { token: "demo3", name: "Sarah Thompson",   answer: "no",  count: 0, message: "Sending love from London", repliedAt: ago(30), createdAt: ago(70) },
  { token: "demo4", name: "Nimal & Kumari",   answer: "yes", count: 4, message: "We'll bring the kids!",  repliedAt: ago(2),  createdAt: ago(60) },
  { token: "demo5", name: "Ishara Jayasuriya", answer: "",   count: 0, message: "",                       repliedAt: "",      createdAt: ago(48) },
  { token: "demo6", name: "Ruwan Silva",      answer: "",    count: 0, message: "",                       repliedAt: "",      createdAt: ago(24) },
];
async function demoApi(body) {
  if (body.action === "invite") {
    const token = "demo" + Date.now();
    demoGuests.push({ token, name: body.name, answer: "", count: 0, message: "", repliedAt: "", createdAt: new Date().toISOString() });
    return { ok: true, token };
  }
  if (body.action === "remove") demoGuests.splice(demoGuests.findIndex(g => g.token === body.token), 1);
  return { ok: true, guests: demoGuests.map(g => ({ ...g })) };
}

// ---- Talking to the Google Apps Script ----
async function api(body) {
  if (DEMO) return demoApi(body);
  const res = await fetch(API, { method: "POST", body: JSON.stringify(body) });
  const data = await res.json();
  if (!data.ok) throw Object.assign(new Error(data.error || "failed"), { code: data.error });
  return data;
}

// ---- Toast and copy ----
let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (t.hidden = true), 2200);
}
async function copy(text, el) {
  try { await navigator.clipboard.writeText(text); toast("Copied"); }
  catch {
    const r = document.createRange(); r.selectNodeContents(el);
    const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
    toast("Selected. Press Copy to copy it");
  }
}

// ---- Sign in ----
async function load() {
  const r = await api({ action: "list", key });
  guests = r.guests;
  $("updated").textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  render();
}
async function signIn(pw, quiet) {
  key = pw;
  try {
    await load();
    try { sessionStorage.setItem("guestlist.key", key); } catch {}
    $("login").hidden = true; $("panel").hidden = false;
  } catch (err) {
    key = "";
    try { sessionStorage.removeItem("guestlist.key"); } catch {}
    if (!quiet) $("loginErr").textContent = err.code === "wrong_password"
      ? "That password doesn't match the one in the Apps Script."
      : "Couldn't reach the guest list. Check your connection and the script URL in config.js.";
  }
}
$("loginForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  $("loginErr").textContent = "";
  $("loginBtn").disabled = true;
  await signIn($("pw").value, false);
  $("loginBtn").disabled = false;
});
$("signOut").addEventListener("click", () => {
  key = ""; guests = [];
  try { sessionStorage.removeItem("guestlist.key"); } catch {}
  $("panel").hidden = true; $("login").hidden = false; $("pw").value = "";
});
if (DEMO) {
  signIn("demo", false);
  toast("Demo mode: sample guests, nothing is saved");
} else if (!API) {
  $("loginErr").textContent = "The guest list isn't connected yet. Paste the Apps Script web app URL into scriptUrl in config.js.";
  $("loginBtn").disabled = true;
} else {
  try { const saved = sessionStorage.getItem("guestlist.key"); if (saved) signIn(saved, true); } catch {}
}

// ---- The list ----
const stateOf = (g) => g.answer === "yes" ? "yes" : g.answer === "no" ? "no" : "wait";
const fmtWhen = new Intl.DateTimeFormat(undefined, { day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });

function render() {
  const rank = { yes: 0, no: 1, wait: 2 };
  const rows = guests.slice().sort((a, b) => rank[stateOf(a)] - rank[stateOf(b)] || a.name.localeCompare(b.name));
  const yes = rows.filter(g => stateOf(g) === "yes");
  $("t-yes").textContent = yes.length;
  $("t-no").textContent = rows.filter(g => stateOf(g) === "no").length;
  $("t-wait").textContent = rows.filter(g => stateOf(g) === "wait").length;
  $("t-people").textContent = yes.reduce((n, g) => n + (Number(g.count) || 1), 0);

  const q = $("g-search").value.trim().toLowerCase();
  const shown = rows.filter(g => (filter === "all" || stateOf(g) === filter) &&
    (!q || g.name.toLowerCase().includes(q) || (g.message || "").toLowerCase().includes(q)));
  const ul = $("guestList"); ul.replaceChildren();
  for (const g of shown) {
    const li = document.createElement("li");
    const st = stateOf(g);
    const nm = document.createElement("span"); nm.className = "gname"; nm.textContent = g.name || "Unnamed guest";
    const chip = document.createElement("span"); chip.className = "chip " + st;
    chip.textContent = st === "yes" ? `Attending · ${Number(g.count) || 1}` : st === "no" ? "Can't come" : "No reply yet";
    nm.append(chip);
    const when = document.createElement("span"); when.className = "when";
    const d = new Date(g.repliedAt || g.createdAt);
    when.textContent = isNaN(d) ? "" : (g.repliedAt ? "Replied " : "Invited ") + fmtWhen.format(d);
    li.append(nm, when);
    if (g.message) { const m = document.createElement("span"); m.className = "gmsg"; m.textContent = `“${g.message}”`; li.append(m); }

    const bar = document.createElement("div"); bar.className = "glink";
    const code = document.createElement("code"); code.textContent = linkFor(g.token);
    const cp = document.createElement("button"); cp.type = "button"; cp.className = "mini"; cp.textContent = "Copy link";
    cp.addEventListener("click", () => copy(code.textContent, code));
    const wa = document.createElement("a"); wa.className = "mini"; wa.target = "_blank"; wa.rel = "noopener"; wa.textContent = "WhatsApp";
    wa.href = `https://wa.me/?text=${encodeURIComponent(waText(g.name, linkFor(g.token)))}`;
    const rm = document.createElement("button"); rm.type = "button"; rm.className = "mini danger"; rm.textContent = "Remove";
    rm.addEventListener("click", async () => {
      if (rm.dataset.armed !== "1") {
        rm.dataset.armed = "1"; rm.textContent = "Tap again to remove";
        setTimeout(() => { rm.dataset.armed = ""; rm.textContent = "Remove"; }, 3000);
        return;
      }
      try { await api({ action: "remove", key, token: g.token }); await load(); toast(`Removed ${g.name}`); }
      catch { toast("Couldn't remove. Try again"); }
    });
    bar.append(code, cp, wa, rm); li.append(bar);
    ul.append(li);
  }
  $("guestEmpty").hidden = shown.length > 0;
  $("guestEmpty").textContent = rows.length ? "No guests match this view." : "No guests yet. Type a guest's name above to make their personal link.";
}

$("g-search").addEventListener("input", render);
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  render();
}));
$("refresh").addEventListener("click", async () => {
  try { await load(); toast("Up to date"); } catch { toast("Couldn't refresh. Try again"); }
});
$("copyList").addEventListener("click", () => {
  const label = { yes: "Attending", no: "Can't come", wait: "No reply yet" };
  const lines = guests.map(g => [g.name, label[stateOf(g)], stateOf(g) === "yes" ? (Number(g.count) || 1) : 0, (g.message || "").replace(/\s+/g, " "), linkFor(g.token)].join("\t"));
  const text = ["Name\tAnswer\tGuests\tNote\tLink", ...lines].join("\n");
  const tmp = document.createElement("pre"); tmp.textContent = text; tmp.style.position = "fixed"; tmp.style.left = "-9999px"; document.body.append(tmp);
  copy(text, tmp).finally(() => setTimeout(() => tmp.remove(), 3000));
});

// ---- New guest ----
$("inviteForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = $("i-name").value.trim();
  if (!name) { toast("Type the guest's name first"); return; }
  if (busy) return;
  busy = true; $("inviteBtn").disabled = true;
  try {
    const r = await api({ action: "invite", key, name });
    const link = linkFor(r.token);
    $("newLinkText").textContent = link;
    $("waNewLink").href = `https://wa.me/?text=${encodeURIComponent(waText(name, link))}`;
    $("newLink").hidden = false;
    $("i-name").value = "";
    await load();
    toast(`Link ready for ${name}`);
  } catch { toast("Couldn't add the guest. Try again"); }
  finally { busy = false; $("inviteBtn").disabled = false; }
});
$("copyNewLink").addEventListener("click", () => copy($("newLinkText").textContent, $("newLinkText")));

// Keep the list fresh while it's open.
setInterval(() => { if (key && !document.hidden) load().catch(() => {}); }, 30000);
</script>
</body>
</html>
